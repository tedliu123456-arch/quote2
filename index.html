<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a3d34">
    <meta name="version" content="20250226k">
    <title>凡構報價系統 v2</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script>
        // 版本檢查 - 強制更新
        const APP_VERSION = '20250226k';
        const savedVersion = localStorage.getItem('vango2_version');
        
        if (savedVersion !== APP_VERSION) {
            localStorage.setItem('vango2_version', APP_VERSION);
        }
    </script>
    <style>
        :root {
            --primary: #1a3d34;
            --primary-light: #2d5a4a;
            --accent: #d4a853;
            --accent-light: #f0d78c;
            --bg: #fdfbf7;
            --surface: #ffffff;
            --text: #2c2c2c;
            --text-muted: #6b6b6b;
            --danger: #e74c3c;
            --success: #27ae60;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.12);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { height: 100%; }
        body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }
        
        /* App Header */
        .app-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white; padding: 14px 18px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 15px rgba(26,61,52,0.3);
        }
        
        .app-title { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .app-logo { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .app-phone { font-size: 12px; opacity: 0.9; }
        
        /* Content */
        .app-content { flex: 1; overflow-y: auto; padding: 120px 16px 16px; -webkit-overflow-scrolling: touch; }
        
        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--surface);
            border-top: 1px solid rgba(212,168,83,0.2);
            display: flex; justify-content: space-around; padding: 10px 0 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
        }
        
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            padding: 8px 20px; color: var(--text-muted); font-size: 11px;
            background: none; border: none; cursor: pointer;
            transition: all 0.2s;
        }
        
        .nav-item.active { color: var(--primary); }
        .nav-item.active .nav-icon { background: var(--accent); color: var(--primary); }
        .nav-icon { font-size: 20px; margin-bottom: 4px; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--bg); transition: all 0.2s; }
        
        /* Cards */
        .card { background: var(--surface); border-radius: 20px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .card-title { font-size: 15px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        
        /* Form */
        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
        .form-input { width: 100%; padding: 14px; border: 2px solid #eee; border-radius: 12px; font-size: 15px; background: var(--bg); transition: all 0.2s; }
        .form-input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        /* Buttons */
        .btn { padding: 16px 24px; border: none; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; box-shadow: 0 4px 15px rgba(26,61,52,0.3); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-accent { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%); color: var(--primary); font-weight: 700; }
        .btn-accent:active { transform: scale(0.98); }
        .btn-block { width: 100%; }
        
        /* Service Grid */
        .service-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
        .service-item { padding: 14px 10px; background: var(--bg); border-radius: 14px; cursor: pointer; text-align: center; font-size: 12px; transition: all 0.2s; border: 2px solid transparent; }
        .service-item:active { background: var(--accent); transform: scale(0.98); }
        
        /* Items */
        .item-row { display: grid; grid-template-columns: 1fr 90px 75px 36px; gap: 8px; padding: 12px 0; border-bottom: 1px solid #f0f0f0; align-items: center; }
        .item-input { padding: 10px; border: 2px solid #eee; border-radius: 10px; font-size: 13px; background: var(--bg); }
        .item-input:focus { border-color: var(--accent); }
        .item-delete { background: none; border: none; color: var(--danger); font-size: 20px; cursor: pointer; }
        
        /* Summary */
        .summary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; border-radius: 20px; padding: 20px; margin: 16px 0; box-shadow: 0 8px 25px rgba(26,61,52,0.3); }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .summary-total { font-size: 22px; font-weight: 700; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 10px; margin-top: 10px; }
        
        /* Quote List */
        .quote-card { background: var(--surface); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); border-left: 4px solid var(--accent); }
        .quote-customer { font-weight: 700; font-size: 16px; color: var(--primary); }
        .quote-vehicle { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
        .quote-total { font-size: 18px; font-weight: 700; color: var(--accent); margin-top: 8px; }
        .quote-date { font-size: 11px; color: var(--text-muted); }
        
        /* Empty */
        .empty { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .empty-icon { font-size: 48px; margin-bottom: 12px; }
        
        /* FAB */
        .fab { position: fixed; bottom: 90px; right: 20px; width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%); color: var(--primary); font-size: 28px; border: none; box-shadow: 0 6px 20px rgba(212,168,83,0.4); cursor: pointer; display: none; align-items: center; justify-content: center; }
        .fab.show { display: flex; }
        
        /* Screen */
        .screen { display: none; }
        .screen.active { display: block; }
        
        /* Services List */
        .service-list-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #f0f0f0; }
        .service-name { font-size: 14px; flex: 1; }
        .service-price { color: var(--accent); font-weight: 700; min-width: 80px; text-align: right; }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="app-title"><span style="font-size:18px;font-weight:700;color:#d4a853;">凡構</span><span style="margin-left:4px;font-size:14px;opacity:0.9;">報價系統</span></div>
        <div style="display:flex;align-items:center;gap:10px;">
            <div class="app-phone">📞 0912-678-660</div>
            <button onclick="clearCache()" style="background:rgba(255,255,255,0.2);border:none;color:white;padding:5px 10px;border-radius:5px;font-size:12px;cursor:pointer;">🔄</button>
        </div>
    </header>
    
    <nav class="bottom-nav" style="position:fixed;top:54px;bottom:auto;border-top:none;border-bottom:1px solid rgba(212,168,83,0.2);">
        <button class="nav-item active" onclick="switchScreen('new')">
            <span class="nav-icon">📝</span><span>報價</span>
        </button>
        <button class="nav-item" onclick="switchScreen('list')">
            <span class="nav-icon">📋</span><span>列表</span>
        </button>
        <button class="nav-item" onclick="switchScreen('presets')">
            <span class="nav-icon">🚗</span><span>車型</span>
        </button>
        <button class="nav-item" onclick="switchScreen('services')">
            <span class="nav-icon">⚙️</span><span>服務</span>
        </button>
    </nav>
    
    <script>
        function clearCache() {
            if(confirm('清除快取並重新載入？\n\n这会刷新页面但保留您的报价记录。')) {
                localStorage.setItem('vango2_version', APP_VERSION);
                location.reload();
            }
        }
    </script>
    
    <div class="app-content">
        <!-- New Quote -->
        <div id="screen-new" class="screen active">
            <div style="text-align:center;padding:8px 0;background:linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);color:white;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.15);">
                <span style="font-size:12px;opacity:0.9;">凡構報價系統</span> <span style="font-size:11px;background:rgba(255,255,255,0.2);padding:2px 8px;border-radius:10px;">v<span id="appVersion"></span></span>
            </div>
            <div class="card">
                <div class="card-header"><div class="card-title">👤 客戶資訊</div></div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label">姓名 *</label><input type="text" id="customerName" class="form-input" placeholder="王先生"></div>
                    <div class="form-group"><label class="form-label">電話</label><input type="tel" id="customerPhone" class="form-input" placeholder="0912-345-678"></div>
                </div>
                <div class="form-group"><label class="form-label">LINE ID</label><input type="text" id="customerLine" class="form-input" placeholder="line12345"></div>
                <div class="form-group"><label class="form-label">👤 業務</label><input type="text" id="salesPerson" class="form-input" placeholder="輸入業務姓名"></div>
                <div class="form-group">
                    <label class="form-label">車輛</label>
                    <div style="display:flex;gap:8px;">
                        <input type="text" id="vehicleInfo" class="form-input" placeholder="Toyota Hiace" style="flex:1;">
                        <select id="vehiclePreset" onchange="loadVehiclePreset()" style="padding:12px;border:2px solid var(--accent);border-radius:10px;font-size:14px;background:white;cursor:pointer;">
                            <option value="">🚗 快捷鍵</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">🚗 車牌號碼</label>
                    <div style="display:flex;gap:8px;">
                        <input type="text" id="licensePlate" class="form-input" placeholder="例如：ABC-1234" style="text-transform:uppercase;flex:1;">
                        <button type="button" onclick="scanLicensePlate()" style="background:var(--accent);color:var(--primary);border:none;padding:12px 16px;border-radius:12px;font-size:18px;cursor:pointer;display:flex;align-items:center;gap:5px;">📷 辨識</button>
                    </div>
                    <div id="scanResult" style="display:none;margin-top:10px;padding:12px;background:#e8f5e9;border-radius:8px;text-align:center;">
                        <span style="color:var(--success);font-weight:bold;">🔍 辨識結果：</span>
                        <span id="scannedPlate" style="font-size:18px;font-weight:bold;color:var(--primary);"></span>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label">📅 進廠日期</label><input type="date" id="entryDate" class="form-input"></div>
                    <div class="form-group"><label class="form-label">🚗 出廠日期</label><input type="date" id="exitDate" class="form-input"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">💰 營業稅 (%)</label>
                    <select id="taxRateInput" class="form-input" onchange="updateTaxRate(this.value)" style="max-width:120px;">
                        <option value="0">未稅 0%</option>
                        <option value="5">營業稅 5%</option>
                    </select>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header"><div class="card-title">🔧 選擇服務</div></div>
                <div class="service-grid" id="serviceGrid"></div>
            </div>
            
            <div class="card">
                <div class="card-header"><div class="card-title">📝 已選項目 <span id="itemCount" style="font-weight:400;color:var(--text-muted);font-size:12px;">0</span></div></div>
                <div id="selectedItems"></div>
            </div>
            
            <div class="card">
                <div class="card-title">📝 備註</div>
                <textarea id="quoteNotes" class="form-input" style="min-height:80px;" placeholder="輸入備註說明..."></textarea>
            </div>
            
            <div class="summary">
                <div class="summary-row"><span>小計</span><span id="subtotal">$0</span></div>
                <div class="summary-row"><span>稅金 (<span id="taxRateLabel">5</span>%)</span><span id="tax">$0</span></div>
                <div class="summary-row" id="discountRow" style="display:none;">
                    <span>折讓 (15%)</span><span id="discount" style="color:var(--danger);">-$0</span>
                </div>
                <div class="summary-row summary-total"><span>總計</span><span id="total">$0</span></div>
            </div>
            
            <button class="btn btn-accent btn-block" id="discountBtn" onclick="toggleDiscount()" style="margin-bottom:14px;">➖ 折讓 15%</button>
            
            <div class="card">
                <div class="card-title">💰 訂金</div>
                <div class="form-group">
                    <input type="number" id="depositAmount" class="form-input" placeholder="輸入訂金金額" value="0" onchange="calculate()">
                </div>
                <div style="font-size:12px;color:var(--text-muted);">
                    尚欠金額：<span id="balanceAmount" style="color:var(--danger);font-weight:600;">$0</span>
                </div>
            </div>
            
            <button class="btn btn-primary btn-block" onclick="saveQuote()">💾 儲存報價</button>
            <div style="display:flex;gap:10px;margin-top:10px;">
                <button class="btn btn-accent btn-block" style="flex:1;" onclick="previewQuote()">👁️ 預覽</button>
                <button class="btn btn-accent btn-block" style="flex:1;" onclick="generatePDF()">📄 PDF</button>
            </div>
        </div>
        
        <!-- List -->
        <div id="screen-list" class="screen">
            <div class="card" style="margin-bottom:10px;">
                <div style="display:flex;gap:8px;">
                    <input type="text" id="quoteSearch" class="form-input" placeholder="搜尋姓名、電話、车牌或车型..." oninput="filterQuotes()" style="flex:1;">
                    <button onclick="filterQuotes()" style="background:var(--primary);color:white;border:none;padding:12px 16px;border-radius:12px;font-size:18px;cursor:pointer;">🔍</button>
                </div>
                <div style="display:flex;gap:8px;margin-top:8px;">
                    <button onclick="scanAndSearch()" style="background:var(--accent);color:var(--primary);border:none;padding:10px 14px;border-radius:10px;font-size:13px;cursor:pointer;flex:1;font-weight:bold;">📷 掃描車牌搜尋</button>
                </div>
            </div>
            <div id="quotesList"></div>
        </div>
        
        <!-- Services -->
        <div id="screen-services" class="screen">
            <div class="card">
                <div class="card-title" style="margin-bottom:14px;">💾 資料備份</div>
                <p style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">匯出所有報價記錄到檔案，或從檔案匯入</p>
                <div style="display:flex;gap:8px;">
                    <button onclick="exportData()" style="background:var(--success);color:white;border:none;padding:12px;border-radius:10px;flex:1;font-weight:bold;">📤 匯出資料</button>
                    <button onclick="document.getElementById('importFile').click()" style="background:var(--primary);color:white;border:none;padding:12px;border-radius:10px;flex:1;font-weight:bold;">📥 匯入資料</button>
                    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importData(this)">
                </div>
            </div>
            
            <div class="card">
                <div class="card-title" style="margin-bottom:14px;">📷 車牌資料庫</div>
                <div id="unknownPlatesList" style="max-height:200px;overflow-y:auto;"></div>
            </div>
            
            <div class="card">
                <div class="card-title" style="margin-bottom:14px;">➕ 新增服務</div>
                <div class="form-group"><input type="text" id="newServiceName" class="form-input" placeholder="服務名稱"></div>
                <div class="form-group"><input type="number" id="newServicePrice" class="form-input" placeholder="價格"></div>
                <button class="btn btn-primary btn-block" onclick="addNewService()">新增</button>
            </div>
            
            <div class="card">
                <div class="card-title" style="margin-bottom:14px;">📋 服務項目</div>
                <div id="allServices"></div>
            </div>
        </div>
        
        <!-- Presets -->
        <div id="screen-presets" class="screen">
            <div class="card">
                <div class="card-title" style="margin-bottom:14px;">🚗 車型快捷鍵</div>
                <div class="form-group"><input type="text" id="presetName" class="form-input" placeholder="輸入車型名稱 (如：福斯加州號)"></div>
                <div id="presetItemsList" style="margin:10px 0;"></div>
                <div style="margin:10px 0;">
                    <div class="card-title" style="font-size:14px;margin-bottom:8px;">📋 選擇服務項目</div>
                    <div id="presetServicesList"></div>
                </div>
                <button class="btn btn-primary btn-block" onclick="savePreset()">💾 儲存為快捷鍵</button>
            </div>
            
            <div class="card">
                <div class="card-title" style="margin-bottom:14px;">📂 已儲存的車型</div>
                <div id="presetsList"></div>
            </div>
        </div>
    </div>
    
    <button class="fab" id="fab" onclick="addNewItem()">+</button>

    <!-- Hidden camera input for license plate scanning -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="processImage(this)">

    <script>
        let services = JSON.parse(localStorage.getItem('vango2_services')) || [
            {name:'太陽能200W',price:12000},{name:'太陽能400W',price:22000},{name:'鋰電100AH',price:18000},{name:'鋰電200AH',price:32000},{name:'配電系統',price:8000},{name:'Inverter',price:15000},{name:'USB座',price:1200},{name:'12V冰箱',price:12000},{name:'LED燈組',price:3500},{name:'工資(基本)',price:5000},{name:'工資(專業)',price:8000}
        ];
        
        let quotes = JSON.parse(localStorage.getItem('vango2_quotes')) || [];
        let selectedItems = [];
        let editingQuoteIndex = null;
        let taxRate = parseFloat(localStorage.getItem('vango2_taxRate')) || 5;
        
        // 車型快捷鍵 - 提前定義避免ReferenceError
        let presets = JSON.parse(localStorage.getItem('vango2_presets')) || [
            {name:'VW Ocean 6.1', items:[{name:'太陽能系統 400W',price:22000},{name:'鋰電200AH',price:32000},{name:'配電系統',price:8000},{name:'inverter',price:15000},{name:'USB座',price:1200},{name:'LED燈組',price:3500}]},
            {name:'VW Beach 6.1', items:[{name:'太陽能系統 400W',price:22000},{name:'鋰電200AH',price:32000},{name:'配電系統',price:8000},{name:'inverter',price:15000},{name:'USB座',price:1200},{name:'LED燈組',price:3500}]},
            {name:'Marco Polo', items:[{name:'太陽能系統 600W',price:28000},{name:'鋰電300AH',price:42000},{name:'配電系統',price:10000},{name:'inverter',price:18000},{name:'USB座',price:2400},{name:'LED燈組',price:5000}]},
            {name:'Sunlight 600rt', items:[{name:'太陽能系統 400W',price:22000},{name:'鋰電200AH',price:32000},{name:'配電系統',price:8000},{name:'inverter',price:15000},{name:'USB座',price:1200},{name:'LED燈組',price:3500}]},
            {name:'Sunlight 600', items:[{name:'太陽能系統 400W',price:22000},{name:'鋰電200AH',price:32000},{name:'配電系統',price:8000},{name:'inverter',price:15000},{name:'USB座',price:1200},{name:'LED燈組',price:3500}]},
            {name:'Sunlight 601', items:[{name:'太陽能系統 400W',price:22000},{name:'鋰電200AH',price:32000},{name:'配電系統',price:8000},{name:'inverter',price:15000},{name:'USB座',price:1200},{name:'LED燈組',price:3500}]},
            {name:'Sunlight T67s', items:[{name:'太陽能系統 600W',price:28000},{name:'鋰電300AH',price:42000},{name:'配電系統',price:10000},{name:'inverter',price:18000},{name:'USB座',price:2400},{name:'LED燈組',price:5000}]},
            {name:'Sunlight T58', items:[{name:'太陽能系統 400W',price:22000},{name:'鋰電200AH',price:32000},{name:'配電系統',price:8000},{name:'inverter',price:15000},{name:'USB座',price:1200},{name:'LED燈組',price:3500}]}
        ];
        
        // 第一次載入時儲存到 localStorage2
        if(!localStorage.getItem('vango2_presets')) {
            localStorage.setItem('vango2_presets', JSON.stringify(presets));
        }
        
        document.addEventListener('DOMContentLoaded', () => { 
            try {
                renderServices(); 
                renderAllServices(); 
                renderQuotes();
                renderPresets();
                renderVehiclePresets();
                document.getElementById('taxRateInput').value = taxRate;
                document.getElementById('appVersion').textContent = APP_VERSION;
            } catch(e) {
                console.error('Init error:', e);
            }
        });

        let discountEnabled = false;
        
        function toggleDiscount() {
            discountEnabled = !discountEnabled;
            const btn = document.getElementById('discountBtn');
            const row = document.getElementById('discountRow');
            if (discountEnabled) {
                btn.style.background = 'var(--danger)';
                btn.style.color = 'white';

                row.style.display = 'flex';
            } else {

            }
            calculate();

        function calculate() {
            let origSubtotal = selectedItems.reduce((sum, i) => sum + i.price * i.qty, 0);
            
            // 折讓計算
            let discount = 0;
            let subtotal = origSubtotal;
            if (discountEnabled) {
                discount = Math.round(origSubtotal * 0.15);
                subtotal = origSubtotal - discount;
            }
            
            let tax = Math.round(subtotal * (taxRate / 100));
            let total = subtotal + tax;
            let deposit = parseInt(document.getElementById('depositAmount').value) || 0;
            let balance = total - deposit;
            
            document.getElementById('subtotal').textContent = '$' + subtotal.toLocaleString();
            document.getElementById('discount').textContent = '-$' + discount.toLocaleString();
            document.getElementById('tax').textContent = '$' + tax.toLocaleString() + ' (' + taxRate + '%)';
            document.getElementById('taxRateLabel').textContent = taxRate;
            document.getElementById('total').textContent = '$' + total.toLocaleString();
            document.getElementById('balanceAmount').textContent = '$' + balance.toLocaleString();
            
            return {subtotal, tax, total, deposit, balance, discount};
        }
        
        function saveQuote() {
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            if(!name) { alert('請填寫姓名'); return; }
            if(selectedItems.length === 0) { alert('請選擇服務項目'); return; }
            
            const {subtotal, tax, total, deposit, balance} = calculate();
            const taxLabel = taxRate === 0 ? '未稅' : '有稅金' + taxRate + '%';
            
            // 產生訂單編號：年月日-編號
            let newId;
            if (editingQuoteIndex !== null) {
                newId = quotes[editingQuoteIndex].id;
            } else {
                const today = new Date().toISOString().slice(0,10).replace(/-/g,'');
                const todayQuotes = quotes.filter(q => q.id.startsWith(today));
                const seq = String(todayQuotes.length + 1).padStart(3, '0');
                newId = today + '-' + seq;
            }
            
            const quote = {
                id: newId,
                date: editingQuoteIndex !== null ? quotes[editingQuoteIndex].date : new Date().toISOString(),
                customer: {
                    name, phone, 
                    line: document.getElementById('customerLine').value.trim(), 
                    vehicle: document.getElementById('vehicleInfo').value.trim(),
                    licensePlate: document.getElementById('licensePlate').value.trim().toUpperCase(),
                    entryDate: document.getElementById('entryDate').value,
                    exitDate: document.getElementById('exitDate').value,
                    salesPerson: document.getElementById('salesPerson').value.trim()
                },
                items: selectedItems.map(i => ({name: i.name, qty: i.qty, price: i.price})),
                notes: document.getElementById('quoteNotes').value.trim(),
                subtotal, tax, total, deposit, balance, taxRate, taxLabel
            };
            
            if(editingQuoteIndex !== null) {
                quotes[editingQuoteIndex] = quote;
                alert('報價單已更新！');
            } else {
                quotes.unshift(quote);
                alert('報價單已儲存！');
            }
            
            localStorage.setItem('vango2_quotes', JSON.stringify(quotes));
            editingQuoteIndex = null;
            clearForm();
            renderQuotes();
            switchScreen('list');
        }
        
        // ===== 車牌辨識功能 =====
        let currentScannedPlate = '';
        
        function scanLicensePlate() {

        function scanAndSearch() {

        // 打開相機掃描器
        function openCameraScanner() {
            const scannerHtml = `
                <div id="cameraScanner" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:flex;flex-direction:column;">
                    <div style="position:absolute;top:10px;right:10px;z-index:10;">
                        <button onclick="closeCameraScanner()" style="background:rgba(255,255,255,0.9);border:none;padding:10px 20px;border-radius:20px;font-size:16px;cursor:pointer;">✕ 關閉</button>
                    </div>
                    <video id="scannerVideo" autoplay playsinline style="width:100%;height:70%;object-fit:cover;"></video>
                    <div style="flex:1;background:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;">
                        <div id="scannerResult" style="color:white;font-size:18px;margin-bottom:15px;text-align:center;">📷 將車牌對準畫面中央</div>
                        <button id="captureBtn" onclick="capturePlate()" style="background:var(--accent);color:var(--primary);border:none;padding:15px 40px;border-radius:30px;font-size:18px;font-weight:bold;cursor:pointer;">📷 拍照辨識</button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', scannerHtml);
            
            // 請求相機權限
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
            })
            .then(stream => {
                document.getElementById('scannerVideo').srcObject = stream;
            })
            .catch(err => {
                alert('無法開啟相機：' + err.message);
                closeCameraScanner();
            });
        }
        
        function closeCameraScanner() {
            const scanner = document.getElementById('cameraScanner');
            if (scanner) {
                const video = document.getElementById('scannerVideo');
                if (video && video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                }
                scanner.remove();
            }
        }
        
        function capturePlate() {
            const video = document.getElementById('scannerVideo');
            const resultDiv = document.getElementById('scannerResult');
            const captureBtn = document.getElementById('captureBtn');
            
            resultDiv.innerHTML = '<span style="animation:pulse 1s infinite;">🔄 辨識中...</span>';
            captureBtn.disabled = true;
            
            // 繪製影片畫面到 Canvas
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            const imgData = canvas.toDataURL('image/jpeg', 0.9).split(',')[1];
            
            // 使用 Plate Recognizer API
            fetch('https://api.platerecognizer.com/v1/plate-reader/', {
                method: 'POST',
                headers: {
                    'Authorization': 'Token 0855c1beecd58a6ff41d646f521439dc532f9a74',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    upload: imgData,
                    regions: ['tw', 'us-ca', 'us'],
                    detect_vehicle: 0,
                    sensitivity: 0.9
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Plate Recognition Result:', data);
                
                if (data.results && data.results.length > 0) {
                    let result = data.results[0];
                    let plate = result.plate.toUpperCase();
                    let confidence = result.confidence ? Math.round(result.confidence * 100) : '';
                    
                    resultDiv.innerHTML = '<span style="color:var(--success);font-size:24px;">✅ ' + plate + '</span>';
                    if (confidence) {
                        resultDiv.innerHTML += '<br><span style="color:#888;font-size:14px;">信心度: ' + confidence + '%</span>';
                    }
                    
                    // 自動填入
                    document.getElementById('licensePlate').value = plate;
                    document.getElementById('vehicleInfo').value = plate;
                    
                    // 2秒後關閉
                    setTimeout(() => {
                        closeCameraScanner();
                        // 顯示在辨識結果區
                        document.getElementById('scanResult').style.display = 'block';
                        document.getElementById('scannedPlate').textContent = plate;
                    }, 1500);
                } else {
                    resultDiv.innerHTML = '<span style="color:#ff6b6b;">❌ 無法辨識，請重試</span>';
                    captureBtn.disabled = false;
                }
            })
            .catch(err => {
                console.error('API Error:', err);
                resultDiv.innerHTML = '<span style="color:#ff6b6b;">❌ 辨識失敗，請重試</span>';
                captureBtn.disabled = false;
            });
        }
        
        function processImage(input) {
            if (!input.files || !input.files[0]) return;
            
            const file = input.files[0];
            const reader = new FileReader();
            
            reader.onload = function(e) {
                // 顯示掃描結果區域
                document.getElementById('scanResult').style.display = 'block';
                document.getElementById('scannedPlate').innerHTML = '<span style="animation:pulse 1s infinite;">🔄 辨識中...</span>';
                
                // 將圖片轉為 base64
                const imgData = e.target.result.split(',')[1];
                
                // 使用 Plate Recognizer API - 優化版
                fetch('https://api.platerecognizer.com/v1/plate-reader/', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Token 0855c1beecd58a6ff41d646f521439dc532f9a74',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        upload: imgData,
                        regions: ['tw', 'us-ca', 'us'],
                        detect_vehicle: 0,
                        sensitivity: 0.8
                    })
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Plate Recognition Result:', data);
                    
                    if (data.results && data.results.length > 0) {
                        // 取第一個結果（最高信心度）
                        let result = data.results[0];
                        let plate = result.plate.toUpperCase();
                        let confidence = result.confidence ? Math.round(result.confidence * 100) : '';
                        
                        document.getElementById('scannedPlate').innerHTML = '<span style="color:var(--success);">✅ ' + plate + (confidence ? ' (' + confidence + '%)' : '') + '</span>';
                        
                        // 填入車牌
                        document.getElementById('licensePlate').value = plate;
                        document.getElementById('vehicleInfo').value = plate;
                        
                        // 自動搜尋
                        document.getElementById('quoteSearch').value = plate;

                    } else if (data.error) {
                        document.getElementById('scannedPlate').textContent = '⚠️ API錯誤: ' + data.error;
                    } else {
                        document.getElementById('scannedPlate').textContent = '❌ 無法辨識，請手動輸入';
                    }
                })
                .catch(function(err) {
                    console.error('Plate Recognizer API Error:', err);
                    document.getElementById('scannedPlate').textContent = '❌ 辨識失敗，請手動輸入';
                });
            };
            
            reader.readAsDataURL(file);
            // 清空 input 以便重新選擇相同檔案
            input.value = '';
        }
        
        function searchByPlate(plateInput) {
            const plate = (plateInput || document.getElementById('quoteSearch').value.trim()).toUpperCase();
            if (!plate) return;
            
            currentScannedPlate = plate;
            
            // 搜尋所有報價記錄
            const matchedQuotes = quotes.filter(q => {
                const vehicle = (q.customer.vehicle || '').toUpperCase().replace(/[\s-]/g, '');
                const licensePlate = (q.customer.licensePlate || '').toUpperCase().replace(/[\s-]/g, '');
                return vehicle.includes(plate) || plate.includes(vehicle) || licensePlate.includes(plate) || plate.includes(licensePlate);
            });
            
            if (matchedQuotes.length > 0) {
                // 找到匹配的報價
                let msg = '找到 ' + matchedQuotes.length + ' 筆資料：\n\n';
                matchedQuotes.forEach((q, i) => {
                    msg += (i+1) + '. ' + q.customer.name + ' - ' + q.customer.vehicle + '\n';
                    msg += '   📅 ' + new Date(q.date).toLocaleDateString('zh-TW') + '\n';
                    msg += '   💰 $' + q.total.toLocaleString() + '\n\n';
                });
                alert(msg);
                
                // 自動填入第一個匹配的資料
                const firstMatch = quotes.indexOf(matchedQuotes[0]);
                editQuote(firstMatch);
            } else {
                // 沒找到，儲存到資料庫
                saveUnmatchedPlate(currentScannedPlate);
                alert('📷 車牌 ' + currentScannedPlate + '\n\n未找到報價記錄，已儲存到資料庫！');
                
                // 自動填入車牌
                document.getElementById('vehicleInfo').value = currentScannedPlate;
                document.getElementById('licensePlate').value = currentScannedPlate;
                switchScreen('new');
            }
        }
        
        function saveUnmatchedPlate(plate) {
            // 取得現有資料
            let plates = JSON.parse(localStorage.getItem('vango2_unknown_plates')) || [];
            
            // 檢查是否已存在
            const exists = plates.find(p => p.plate === plate);
            if (!exists) {
                plates.push({
                    plate: plate,
                    found: false,
                    date: new Date().toISOString()
                });
                localStorage.setItem('vango2_unknown_plates', JSON.stringify(plates));
            }
        }
        
        function filterQuotes() {
            const keyword = document.getElementById('quoteSearch').value.trim().toLowerCase().replace(/-/g, '');
            const container = document.getElementById('quotesList');
            
            if(keyword === '') {
                renderQuotes();
                return;
            }
            
            const filtered = quotes.filter(q => 
                (q.customer.name && q.customer.name.toLowerCase().replace(/-/g, '').includes(keyword)) ||
                (q.customer.phone && q.customer.phone.toLowerCase().replace(/-/g, '').includes(keyword)) ||
                (q.customer.vehicle && q.customer.vehicle.toLowerCase().replace(/-/g, '').includes(keyword)) ||
                (q.customer.licensePlate && q.customer.licensePlate.toLowerCase().replace(/-/g, '').includes(keyword)) ||
                (q.customer.salesPerson && q.customer.salesPerson.toLowerCase().replace(/-/g, '').includes(keyword))
            );
            
            if(filtered.length === 0) {
                container.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><p>找不到符合的報價記錄</p></div>';
                return;
            }
            
            container.innerHTML = filtered.map((q, idx) => {
                const realIdx = quotes.indexOf(q);
                return `
                <div class="quote-card" onclick="viewQuoteDetail(${realIdx})">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <div class="quote-customer">${q.customer.name}${q.customer.salesPerson ? ' <span style="font-size:11px;background:var(--accent);color:var(--primary);padding:2px 6px;border-radius:4px;">' + q.customer.salesPerson + '</span>' : ''}</div>
                        <div style="display:flex;align-items:center;gap:8px;">

        async function generatePDF() {
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            if(!name) { alert('請填寫姓名'); return; }
            if(selectedItems.length === 0) { alert('請選擇服務項目'); return; }
            
            const {subtotal, tax, total} = calculate();
            const line = document.getElementById('customerLine').value.trim();
            const vehicle = document.getElementById('vehicleInfo').value.trim();
            const entryDate = document.getElementById('entryDate').value;
            const exitDate = document.getElementById('exitDate').value;
            const salesPerson = document.getElementById('salesPerson').value.trim();
            const notes = document.getElementById('quoteNotes').value.trim();
            const deposit = parseInt(document.getElementById('depositAmount').value) || 0;
            
            const quoteDate = new Date().toLocaleDateString('zh-TW');
            const quoteId = 'VQ' + Date.now();
            
            let itemsHtml = selectedItems.map(item => `
                <tr>
                    <td>${item.name}</td>
                    <td style="text-align:center;">${item.qty}</td>
                    <td style="text-align:right;">$${(item.price * item.qty).toLocaleString()}</td>

            `).join('');
            
            const pdfContent = `
                <div style="font-family: 'Noto Sans TC', 'Microsoft JhengHei', Arial, sans-serif; padding: 20px; color: #2c2c2c;">

                        <p style="color:#666;margin:5px 0;">📞 0912-678-660 | LINE: @0912678660</p>
                    </div>
                    
                    <div style="display:flex;justify-content:space-between;margin:15px 0;padding:10px;background:#f5f5f5;border-radius:8px;">
                        <span>📅 日期：${quoteDate}</span>
                        <span>📋 單號：${quoteId}</span>
                    </div>
                    
                    <div style="padding:15px;background:#fdfbf7;border-radius:8px;margin-bottom:15px;">
                        <h3 style="color:#1a3d34;margin:0 0 10px 0;">客戶資訊</h3>
                        <p style="margin:3px 0;">👤 姓名：${name}</p>
                        <p style="margin:3px 0;">📞 電話：${phone}</p>
                        ${salesPerson ? `<p style="margin:3px 0;">👔 業務：${salesPerson}</p>` : ''}
                        ${line ? `<p style="margin:3px 0;">💬 LINE：${line}</p>` : ''}
                        ${vehicle ? `<p style="margin:3px 0;">🚗 車輛：${vehicle}</p>` : ''}
                        ${entryDate ? `<p style="margin:3px 0;">📅 進廠日期：${entryDate}</p>` : ''}
                        ${exitDate ? `<p style="margin:3px 0;">🚗 出廠日期：${exitDate}</p>` : ''}
                    </div>
                    
                    <table style="width:100%;border-collapse:collapse;margin-bottom:15px;">
                        <thead>
                            <tr style="background:#1a3d34;color:white;">
                                <th style="padding:10px;text-align:left;">項目</th>
                                <th style="padding:10px;text-align:center;">數量</th>
                                <th style="padding:10px;text-align:right;">金額</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsHtml}
                        </tbody>
                    </table>
                    
                    <div style="text-align:right;padding:15px;background:#1a3d34;color:white;border-radius:8px;">
                        <div style="margin:5px 0;">小計：$${subtotal.toLocaleString()}</div>
                        <div style="margin:5px 0;">稅金 (${taxRate}%)：$${tax.toLocaleString()}</div>
                        <div style="font-size:20px;font-weight:bold;margin-top:10px;">總計：$${total.toLocaleString()}</div>
                        ${deposit > 0 ? `
                        <div style="margin:5px 0;font-size:14px;opacity:0.9;">💵 訂金：$${deposit.toLocaleString()}</div>
                        <div style="margin:5px 0;font-size:14px;opacity:0.9;">💳 尚欠：$${(total-deposit).toLocaleString()}</div>
                        ` : ''}
                    </div>
                    
                    ${notes ? `
                    <div style="margin-top:15px;padding:15px;background:#fff9e6;border-radius:8px;">

                    </div>

                    <div style="text-align:center;margin-top:30px;color:#999;font-size:12px;">

            const opt = {
                margin: 10,
                filename: '報價單-' + quoteId + '.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            html2pdf().set(opt).from(pdfContent).save();
        }
